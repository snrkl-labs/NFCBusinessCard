# Compose UI tests run under Robolectric on the JVM rather than on an AVD.
#
# An unattended build loop should not depend on an emulator: it is slow to boot,
# it is by far the largest consumer of memory on the build host, and when the
# host comes under pressure the emulator is what gets killed — taking the test
# run with it. Robolectric gives the same semantics-tree and layout assertions
# inside the ordinary testDebugUnitTest gate.
#
# SDK 34 matches compileSdk. Robolectric fetches the matching android-all jar on
# first run.
sdk=34

# A phone-shaped window rather than Robolectric's small default. Layout
# assertions are only meaningful against a realistic screen — the default is
# narrow enough that ordinary content falls below the fold and every
# assertIsDisplayed becomes a scroll-position test by accident.
# 411 x 891 dp at xxhdpi is a Pixel-class device.
qualifiers=w411dp-h891dp-xxhdpi
